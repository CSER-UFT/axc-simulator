# Publica o simulador no GitHub Pages a cada push no branch principal, depois que os testes passam.
# Os resultados da síntese (data/synth.json e data/evoapprox.json) vêm do repositório: são gerados localmente com
# npm run synth e npm run evoapprox (horas de Yosys, Icarus Verilog e OpenSTA para o espaço de projeto inteiro),
# não a cada publicação.
# Em Settings > Pages, selecione "GitHub Actions" como fonte.
name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: npm test
      - name: Conferir os resultados da síntese
        run: test -s data/synth.json && node -e "const s=require('./data/synth.json'); if (!s.asic?.flows) process.exit(1); console.log(s.designs.length + ' configurações sintetizadas em ' + s.generated)"
      - name: Preparar site
        run: |
          mkdir _site
          cp -r index.html hls.html js css svg data _site/
          node scripts/stamp.mjs _site "${GITHUB_SHA::8}"
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
